<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registros de Auditoria</title>
</head>
<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-journal-text me-2 text-primary"></i>Auditoria
        </h2>
        <span class="text-muted small" th:text="|${#lists.size(auditorias)} registro(s)|">0 registro(s)</span>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Data e hora</th>
                        <th>Usuário</th>
                        <th>Perfil</th>
                        <th>Operação</th>
                        <th>Registro afetado</th>
                        <th>Alterações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(auditorias)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum registro de auditoria encontrado.
                        </td>
                    </tr>
                    <tr th:each="registro : ${auditorias}">
                        <td class="ps-4 small text-nowrap" th:text="${registro.dataHora}">2026-10-16T05:30</td>
                        <td th:text="${registro.usuario}">Gerente1</td>
                        <td><span class="badge bg-secondary" th:text="${registro.perfil}">GERENTE</span></td>
                        <td th:text="${registro.operacao}">ALTERAR_STATUS</td>
                        <td>
                            <div th:text="${registro.entidade}">Pedido</div>
                            <small class="text-muted" th:text="${registro.entidadeId}">ID</small>
                        </td>
                        <td>
                            <details>
                                <summary class="text-primary" style="cursor: pointer">Ver detalhes</summary>
                                <div class="mt-2 small" style="min-width: 230px; max-width: 420px; overflow-wrap: anywhere;">
                                    <strong>Antes:</strong>
                                    <div class="mb-2" th:text="${registro.valoresAnteriores}">-</div>
                                    <strong>Depois:</strong>
                                    <div class="mb-2" th:text="${registro.valoresNovos}">-</div>
                                    <div th:if="${registro.justificativa != null and !#strings.isEmpty(registro.justificativa)}">
                                        <strong>Justificativa:</strong>
                                        <div th:text="${registro.justificativa}">-</div>
                                    </div>
                                </div>
                            </details>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
